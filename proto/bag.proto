syntax = "proto3";

package chenxiao.bag;

option go_package = "chenxiao/proto/bag;bag";

import "common.proto";

// 背包物品（可堆叠：材料/消耗品/碎片；装备走 equip 模块）
message BagItem {
  int64 uid = 1;      // 实例 ID
  int32 item_id = 2;  // 物品配置 ID
  int32 item_type = 3;// 类型 1=材料 2=消耗品 3=碎片 4=其他
  int64 count = 4;
  bool is_bound = 5;
}

// 背包列表
message C2SBagList {}
message S2CBagList {
  common.Result result = 1;
  repeated BagItem items = 2;
}

// 使用物品
message C2SBagUseItem {
  int64 uid = 1;
  int64 count = 2;
}
message S2CBagUseItem {
  common.Result result = 1;
  repeated common.RewardItem rewards = 2; // 使用后产出
  BagItem item = 3;                        // 剩余数量（0 表示已用完）
}
