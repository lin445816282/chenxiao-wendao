syntax = "proto3";

package chenxiao.dungeon;

option go_package = "chenxiao/proto/dungeon;dungeon";

import "common.proto";

// ============================================================
// 秘境闯关 / 战斗
// 核心原则：服务端权威计算整场战斗，一次性下发「回合序列」，
// 客户端只按序列播放表现动画与飘字，不参与任何数值计算。
// ============================================================

// 出战单位
message CombatUnit {
  int32 kind = 1;      // 1=角色 2=灵宠
  int64 uid = 2;       // 角色=player_id；灵宠=pet 实例 uid
  int32 config_id = 3; // 角色=1；灵宠=pet 配置 ID
}

// 开始战斗
message C2SStartStage {
  int32 stage_type = 1;       // 1=普通 2=精英 3=BOSS
  int32 stage_id = 2;         // 关卡配置 ID
  repeated CombatUnit team = 3; // 出战阵容（服务端校验合法性）
}

// 回合内一次行动
message BattleAction {
  int64 attacker_uid = 1;   // 攻击方 uid
  int32 attacker_kind = 2;  // 攻击方 kind（1=角色 2=灵宠 3=怪物）
  int64 target_uid = 3;     // 受击方 uid
  int32 target_kind = 4;    // 受击方 kind
  int32 skill_id = 5;       // 技能配置 ID
  int64 damage = 6;         // 伤害
  int64 heal = 7;           // 治疗
  bool is_crit = 8;         // 是否暴击
  bool is_dodge = 9;        // 是否闪避
}

// 一个回合（含双方多次行动）
message BattleRound {
  int32 round = 1;
  repeated BattleAction actions = 2;
}

// 装备掉落
message EquipDrop {
  int64 equip_uid = 1;
  int32 equip_id = 2;
  int32 pos = 3;                 // 部位
  repeated common.EquipAffix affixes = 4; // 随机词条
  int32 score = 5;
}

// 灵宠掉落
message PetDrop {
  int64 pet_uid = 1;
  int32 pet_id = 2;
}

// 战斗结果
message S2CStartStage {
  common.Result result = 1;
  bool win = 2;
  int32 star = 3;                          // 1-3 星
  repeated BattleRound rounds = 4;         // 回合序列（表现回放）
  repeated common.RewardItem rewards = 5;  // 货币/材料奖励
  repeated EquipDrop equips = 6;           // 装备掉落
  repeated PetDrop pets = 7;               // 灵宠掉落
  int32 clear_times = 8;                   // 本关累计通关次数
}

// 扫荡（快速通关，无需回放）
message C2SSweepStage {
  int32 stage_type = 1;
  int32 stage_id = 2;
  int32 times = 3; // 扫荡次数
}

message S2CSweepStage {
  common.Result result = 1;
  repeated common.RewardItem rewards = 2;
  repeated EquipDrop equips = 3;
  repeated PetDrop pets = 4;
}
