syntax = "proto3";

package chenxiao.offline;

option go_package = "chenxiao/proto/offline;offline";

import "common.proto";

// ============================================================
// 挂机修炼 / 离线收益
// 收益完全由服务端根据「离线时长 × 最高通关产出系数 × 倍率」结算，
// 客户端只查询预览与领取结果，不参与数值计算。
// ============================================================

// 查询离线收益预览（未领取）
message C2SOfflineRewardQuery {}

message S2COfflineRewardQuery {
  common.Result result = 1;
  int64 offline_seconds = 2;            // 已结算的离线时长（已封顶，如 24h）
  repeated common.RewardItem rewards = 3; // 收益预览
  int32 hang_multiplier = 4;            // 当前挂机倍率（受广告加成影响）
}

// 一键领取离线收益
message C2SOfflineRewardClaim {
  int64 client_ts = 1; // 客户端时间戳，仅作参考，服务端以自身时间结算
}

message S2COfflineRewardClaim {
  common.Result result = 1;
  repeated common.RewardItem rewards = 2; // 实际到账
  int64 settled_seconds = 3;              // 本次覆盖的离线秒数
  int64 next_settle_at = 4;               // 下次结算基准时间
}

// 在线挂机（限时/次数收益）查询与领取
message C2SHangRewardQuery {}
message S2CHangRewardQuery {
  common.Result result = 1;
  repeated common.RewardItem rewards = 2; // 当前可领取的在线挂机收益
  int64 remain_seconds = 3;               // 距离下次收益倒计时
}

message C2SHangRewardClaim {}
message S2CHangRewardClaim {
  common.Result result = 1;
  repeated common.RewardItem rewards = 2;
}
