syntax = "proto3";

package chenxiao.rank;

option go_package = "chenxiao/proto/rank;rank";

import "common.proto";

// 榜单条目
message RankEntry {
  int32 rank_no = 1;
  int64 player_id = 2;
  string nickname = 3;
  string avatar = 4;
  int32 level = 5;
  int64 score = 6; // 战力 / 层数 / 等级，依榜单类型而定
}

// 查询排行榜
message C2SRankQuery {
  int32 rank_type = 1; // 1=战力 2=秘境层数 3=等级
  int32 page = 2;      // 从 0 开始
  int32 page_size = 3;
}

message S2CRankQuery {
  common.Result result = 1;
  repeated RankEntry entries = 2;
  RankEntry my_rank = 3; // 我的名次（未上榜可为空）
}
