# 《尘霄问道》网关 Nginx 反代配置（WSS/HTTPS）
# 放置：/etc/nginx/conf.d/chenxiao.conf
# 作用：wss://你的域名/ws  -> 127.0.0.1:8080/ws（TLS 在 Nginx 终结）
# 把 game.example.com 换成你的备案域名

upstream chenxiao_gateway {
    server 127.0.0.1:8080;
    keepalive 64;
}

server {
    listen 80;
    server_name game.example.com;

    # Let's Encrypt 证书签发需要 80 端口
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    # 其余 HTTP 一律跳 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name game.example.com;

    ssl_certificate     /etc/letsencrypt/live/game.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/game.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # WebSocket 升级
    location /ws {
        proxy_pass http://chenxiao_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 健康检查
    location /healthz {
        proxy_pass http://chenxiao_gateway;
        proxy_set_header Host $host;
    }
}
